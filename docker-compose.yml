# doc-extract — local stack
#
# Run:    docker compose up --build
# Open:   http://localhost:8080
#
# First build is slow (~5-10 min): downloads PyTorch CPU wheels + ~1.5 GB of
# GOT-OCR model weights into the API image. Subsequent runs are fast.

services:
  doc-extract-api:
    build:
      context: ./doc-extract-api
    container_name: doc-extract-api
    restart: unless-stopped
    # Internal-only — the web service proxies to it. Uncomment to expose for
    # direct API access during development:
    # ports:
    #   - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - doc-extract

  doc-extract-web:
    build:
      context: ./doc-extract-web
    container_name: doc-extract-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - doc-extract-api
    networks:
      - doc-extract

networks:
  doc-extract:
    driver: bridge

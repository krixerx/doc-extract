server {
    listen 80;
    server_name _;

    # Allow large document uploads (default is 1 MB)
    client_max_body_size 25M;

    # Serve the React SPA
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Proxy API calls to the backend container
    location /api/ {
        proxy_pass http://doc-extract-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OCR may take minutes on CPU. A 10-page PDF at ~1-3 min/page can hit ~30 min worst case.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 30s;
    }
}
